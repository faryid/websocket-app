<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Notes</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Canvas */
    body {
      margin: 0;
      color: #333;
      background: #f2f2f2;
    }

    .canvas {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: space-evenly;
      justify-content: space-evenly;
    }

    /* Sticky note */
    .sticky-note {
      position: relative;
      width: 439px;
      height: 413px;
      padding: 56px 38px;
      background: #ffeb3b;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    /* Text */
    .sticky-note p {
      margin: 0;
      color: inherit;
      font-size: 24px;
      line-height: 1.4;
    }

    /* Pin */
    .pin {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #c62828;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .pin::after {
      content: '';
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 28px;
      background: #555;
    }

    /* Folded corner */
    .fold {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 75px solid #fbc02d;
      border-top: 75px solid transparent;
      box-shadow: 5px -5px 10px rgba(0, 0, 0, 0.15);
    }

    .note-content {
      text-align: left;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .body p {
      font-size: 22px;
      margin: 10px 0;
      line-height: 1.4;
    }

    .note-input {
      /* width: 100%;
      height: 100%;
      resize: none;
      border: none;
      outline: none;
      background: transparent;

      color: #333;
      font-size: 22px;
      line-height: 1.4;
      font-family: Arial, sans-serif; */

      padding: 0;
      width: 363px;
      height: 259px;
      box-sizing: border-box;

      resize: none;
      border: none;
      outline: none;
      background: transparent;

      color: #333;
      font-size: 22px;
      line-height: 1.4;
      font-family: Arial, sans-serif;
    }

    @media screen and (max-width: 439px) {
      .sticky-note {
        width: 90vw;
        height: auto;
        padding: 32px 22px;
        padding-bottom: 62px;
      }

      .title {
        font-size: 26px;
      }

      .body p {
        font-size: 18px;
      }

      .pin {
        top: -18px;
        width: 22px;
        height: 22px;
      }

      .pin::after {
        top: 20px;
        height: 20px;
        width: 3px;
      }

      .fold {
        border-left: 55px solid #fbc02d;
        border-top: 55px solid transparent;
      }

      .note-input {
        width: 78vw;
        height: auto;
        font-size: 18px;
      }
    }

    @media screen and (max-height: 667px) {
      .sticky-note_margin {
        margin: 5vw 0;
      }
    }
  </style>
</head>

<body>
  <div class="canvas">
    <div class="sticky-note sticky-note_margin">
      <div class="pin"></div> <!-- Simpled pin -->
      <div class="fold"></div> <!-- Folded corner -->
      <div class="note-content"> <!-- Note content textarea -->
        <textarea id="note" class="note-input" placeholder="Type your thoughts in here..."></textarea>
      </div>
    </div>

    <div class="sticky-note">
      <div class="pin"></div> <!-- Red pin -->
      <div class="fold"></div> <!-- Folded corner -->

      <div class="note-content">
        <div class="title">Warning !!!</div>
        <div class="body"> <!-- Note content -->
          <p>Inbound account is already optimized</p>
          <p>Don’t need to worry, confuse, or overwhelming</p>
          <p>All accounts and productivity tools already been set</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function adjustTextareaHeight() {
      const secondNoteContent = document.querySelectorAll('.note-content')[1];
      const firstTextarea = document.querySelector('.note-input');
      const viewportWidth = window.innerWidth;

      if (viewportWidth <= 439) {
        const height = secondNoteContent.clientHeight;
        firstTextarea.style.height = height + 'px';
      } else {
        firstTextarea.style.height = '259px';
      }
    }

    window.addEventListener('load', adjustTextareaHeight);

    window.addEventListener('resize', adjustTextareaHeight);
  </script>

  <script>
    const ws = new WebSocket("ws://" + window.location.host);

    const textarea = document.getElementById("note");

    textarea.addEventListener("input", () => {
      ws.send(textarea.value);
    });

    ws.onmessage = (event) => textarea.value = event.data;
  </script>
</body>

</html>
